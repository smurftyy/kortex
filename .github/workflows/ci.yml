name: CI

on:
  push:
    branches: [dev, staging, master]
  pull_request:
    branches: [dev, staging, master]

defaults:
  run:
    working-directory: apps/api

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: ruff check
        run: ruff check app tests

      - name: mypy
        run: mypy app

  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      # test_worker.py needs a real Redis (Commit 9) to actually run instead
      # of skipping — the redis: service above provides one, reachable via
      # localhost from an uncontainerized job. Everything else the test
      # suite needs (Supabase settings) comes from tests/conftest.py's
      # autouse fixture, not real secrets — nothing else to set here.
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: pytest
        run: pytest
