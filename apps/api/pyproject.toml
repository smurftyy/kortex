[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kortex-api"
version = "0.1.0"
description = "Kortex API — semi-automated internship and job hunting platform"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
authors = [
    { name = "smurftyy", email = "oladapooloyede185@gmail.com" },
]
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "supabase",
    "redis",
    "arq",
    "python-multipart",
    "pyjwt",
    "pymupdf",
    "httpx",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.sdist]
include = [
    "/app",
    "/README.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = ["app"]
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
