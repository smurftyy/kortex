services:
  api:
    build: ./apps/api
    ports:
      - "8000:8000"
    env_file:
      - ./apps/api/.env
    depends_on:
      - redis

  worker:
    build: ./apps/api
    command: ["arq", "app.worker.WorkerSettings"]
    env_file:
      - ./apps/api/.env
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
